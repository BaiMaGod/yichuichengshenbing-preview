name: Build and publish preview (source remains private)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-preview.yml'

permissions:
  contents: write

concurrency:
  group: forge-preview-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check private source access
        env:
          SOURCE_TOKEN: ${{ secrets.FORGE_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Preview repository secret FORGE_SOURCE_TOKEN is required to read the private formal source repository. No source or credentials are published in preview."
            exit 1
          fi

      - name: Checkout preview (compiled artifacts only)
        uses: actions/checkout@v4
        with:
          path: preview
          persist-credentials: true

      - name: Checkout private source into ephemeral runner
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/yichuichengshenbing
          ref: e25c66bb91296c6b95afc72c20bc6599424f6f41
          token: ${{ secrets.FORGE_SOURCE_TOKEN }}
          path: private-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-source/package-lock.json

      - name: Install dependencies in ephemeral source checkout
        working-directory: private-source
        run: npm ci --no-audit --no-fund

      - name: Verify tribute V4.2 and established game rules before publishing
        working-directory: private-source
        run: npm test

      - name: Build browser version for preview only
        working-directory: private-source
        run: npm run build

      - name: Build complete high-tier sword inspection preview
        working-directory: private-source
        run: npm run build:sword-high-study

      - name: Install browser for pre-publish frenzy regression
        working-directory: private-source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium

      - name: Verify same-sword resume, merchant-only sales and large readable swords
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/finish-sword
        run: node --experimental-strip-types qa/finish-sword-review.mjs

      - name: Upload sword flow and visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finish-sword-v035
          path: private-source/qa-evidence/finish-sword/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify six rack slots, capped sales and clean tribute receipts
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/rack-tribute
        run: node --experimental-strip-types qa/rack-tribute-review.mjs

      - name: Upload rack lighting and tribute receipt verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rack-tribute-sale-v033
          path: private-source/qa-evidence/rack-tribute/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify world-space anvil impact rings on phone and desktop
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/impact-rings
        run: node --experimental-strip-types qa/forge-impact-rings-review.mjs

      - name: Upload world-space impact ring screenshots and measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-world-impact-rings
          path: private-source/qa-evidence/impact-rings/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify audible frenzy music, screen-space shake and feedback lifecycle
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/forge-feedback
        run: node --experimental-strip-types -e "import('./qa/forge-feedback-review.mjs').then(m=>m.runFeedbackReview()).then(r=>console.log(JSON.stringify(r,null,2)))"

      - name: Verify full-screen frenzy and super-god effects, lifecycle and input
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/screen-fx
        run: node --experimental-strip-types -e "import('./qa/forge-screen-fx-review.mjs').then(m=>m.runScreenFxReview()).then(r=>console.log(JSON.stringify(r,null,2)))"

      - name: Upload full-screen effect screenshots and measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-screen-forge-fx
          path: private-source/qa-evidence/screen-fx/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload measured frenzy audio and camera feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-feedback-audio-camera
          path: private-source/qa-evidence/forge-feedback/
          if-no-files-found: warn
          retention-days: 7

      - name: Build TapTap channel for interaction regression only
        working-directory: private-source
        run: npm run build:taptap

      - name: Verify tribute panels, relic management, dispenser refresh and merchant trading
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/workshop-ui
        run: node --experimental-strip-types qa/workshop-ui-review.mjs

      - name: Upload workshop interaction verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-ui-v031
          path: private-source/qa-evidence/workshop-ui/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify all 111 sword forms and complete front-side-back geometry
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/sword-suite
        run: npm run test:sword-gallery

      - name: Verify sword families in desktop and phone workshop, enchantment, rack and tribute
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/sword-suite-game
        run: npm run test:sword-game

      - name: Verify three high-tier silhouettes and front metal exposure
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/high-tier
        run: |
          node scripts/build-sword-study.mjs qa-evidence/high-tier/study.html
          node qa/sword-high-tier-review.mjs qa-evidence/high-tier/study.html

      - name: Verify new mythic sword metal, front-side-back and live effects
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/mythic
        run: |
          npm run build:sword-mythic-study
          node qa/sword-mythic-review.mjs

      - name: Verify original-reference sword silhouettes and animated materials
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/faithful
        run: |
          npm run build:sword-faithful-study
          node qa/sword-faithful-review.mjs

      - name: Verify visible sword glow outside the metal silhouette
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/faithful-shine
        run: node qa/sword-shine-review.mjs

      - name: Verify native sword effects in desktop and phone gameplay
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/faithful-native-game
          QA_FORMS: normal:dragon_slayer:10,normal:dragon_fang:10,special:abyss:10
        run: node --experimental-strip-types qa/sword-shine-game-review.mjs

      - name: Verify royal sword reference shapes, metal and exterior glow
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/royal
        run: |
          npm run build:sword-royal-study
          node qa/sword-royal-review.mjs

      - name: Verify royal mobile inspection preview and offline operation
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/royal-mobile
        run: node qa/sword-royal-mobile.mjs

      - name: Verify approved royal sword forms in actual desktop and phone gameplay
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/royal-game
        run: node --experimental-strip-types qa/sword-royal-game-review.mjs

      - name: Verify complete high-tier mobile controls and native effects
        working-directory: private-source
        run: node qa/sword-high-fx-review.mjs

      - name: Verify remaining high-tier families in desktop and phone gameplay
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/high-complete-game
          QA_FORMS: normal:dragon_fang:9,normal:meteor:9,normal:genesis:8,normal:runic:9,normal:thunder:9,special:abyss:9,special:worldtree:9,special:underworld:9,special:light_hero:10,special:milk_frog:10,special:hakimi:10
        run: node --experimental-strip-types qa/sword-high-game-review.mjs

      - name: Upload sword suite screenshots and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sword-suite-v1
          path: |
            private-source/qa-evidence/sword-suite/
            private-source/qa-evidence/sword-suite-game/
            private-source/qa-evidence/high-tier/
            private-source/qa-evidence/mythic/
            private-source/qa-evidence/faithful/
            private-source/qa-evidence/faithful-shine/
            private-source/qa-evidence/faithful-native-game/
            private-source/qa-evidence/royal/
            private-source/qa-evidence/royal-mobile/
            private-source/qa-evidence/royal-game/
            private-source/qa-evidence/high-fx/
            private-source/qa-evidence/high-complete-game/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify frenzy, super-god, countdown, repeated modes and archived sword
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/frenzy
        run: node --experimental-strip-types qa/frenzy-performance.mjs

      - name: Upload frenzy screenshots and measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frenzy-performance-v5
          path: private-source/qa-evidence/frenzy/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify panda whip animation on phone and desktop
        working-directory: private-source
        env:
          QA_OUT: qa-evidence/whip
        run: node qa/whip-review.mjs

      - name: Upload panda whip animation verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-whip-animation
          path: private-source/qa-evidence/whip/
          if-no-files-found: warn
          retention-days: 7

      - name: Validate compiled release has no source
        run: |
          test -f private-source/dist/index.html
          test -f private-source/dist/sword-gallery.html
          test -f private-source/dist/sword-mythic-study.html
          test -f private-source/dist/sword-faithful-study.html
          test -f private-source/dist/sword-royal-study.html
          test -f private-source/dist/sword-high-study.html
          test -d private-source/dist/assets
          test -f private-source/dist/release.json
          if find private-source/dist -type f \( -name '*.ts' -o -name '*.map' \) | grep -q .; then
            echo "::error::Build output contains TypeScript or sourcemaps"
            exit 1
          fi

      - name: Copy only compiled files and stamp source version
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # The source checkout lives only in the runner, never in the public preview git tree.
          rsync -a private-source/dist/ preview/
          python3 - <<'PY'
          import pathlib,subprocess,json,re
          root=pathlib.Path('preview')
          sha=subprocess.check_output(['git','-C','private-source','rev-parse','HEAD'],text=True).strip()
          html=(root/'index.html').read_text()
          html=re.sub(r'<meta name="source-commit" content="[a-f0-9]{40}">','',html)
          html=html.replace('<head>','<head>\n<meta name="source-commit" content="'+sha+'">',1)
          (root/'index.html').write_text(html)
          release=root/'release.json'
          info=json.loads(release.read_text())
          info['sourceCommit']=sha
          info['previewRelease']='v0.3.5-revive-share'
          release.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          for forbidden in ['src','tests','node_modules','docs']:
            assert not (root/forbidden).exists(),'Public preview must not include private source: '+forbidden
          print('Prepared preview from private source commit',sha)
          PY

      - name: Commit compiled preview only
        working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sword-gallery.html sword-mythic-study.html sword-faithful-study.html sword-royal-study.html sword-high-study.html release.json assets art audio 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Preview already matches the source build"
          else
            git commit -m "deploy: tribute selector and one-time sword revival"
            git push origin HEAD:main
          fi
# Preview-only V4.2 release: tribute supply, no apprentice contracts, daily rewarded offerings.
