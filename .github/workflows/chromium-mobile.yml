name: 3D workshop browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese fonts and Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run real WebGL gameplay and capture three sizes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/forge-server.log 2>&1 &
          node qa/browser-playtest.mjs
      - name: Upload actual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-forge-3d-browser-qa
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 7
