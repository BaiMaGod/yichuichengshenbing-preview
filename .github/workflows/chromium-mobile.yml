name: 3D workshop browser QA
on:
  push:
    branches: [main, 'qa-polish-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Browser ${{ matrix.size }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        size: ['390x844', '360x800', '1280x900']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese fonts and Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run real WebGL gameplay and capture three sizes
        env:
          QA_SIZE: ${{ matrix.size }}
          QA_URL: http://127.0.0.1:4173/yichuichengshenbing-preview/
        run: |
          mkdir -p /tmp/forge-pages-qa
          ln -s "$GITHUB_WORKSPACE" /tmp/forge-pages-qa/yichuichengshenbing-preview
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/forge-pages-qa >/tmp/forge-server.log 2>&1 &
          node qa/browser-playtest.mjs
      - name: Upload actual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-forge-3d-browser-qa-${{ matrix.size }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 7
