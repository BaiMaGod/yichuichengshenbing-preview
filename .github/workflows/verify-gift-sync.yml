name: Verify gift synchronization fix
on:
  push:
    branches: [verify-gift-sync-20261030]
    paths: ['.github/workflows/verify-gift-sync.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned private source for verification only
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/yichuichengshenbing
          ref: d985c92d2a87d4b6ae16ac2d3951eb0006275cf6
          token: ${{ secrets.FORGE_SOURCE_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: private-source
        run: npm ci --no-audit --no-fund
      - name: Run the full Node regression suite
        working-directory: private-source
        run: |
          set -o pipefail
          mkdir -p qa-evidence/gifts
          npm test | tee qa-evidence/gifts/unit-tests.log
      - name: Typecheck and build Web
        working-directory: private-source
        run: npm run build
      - name: Install test browser and Chinese fonts
        working-directory: private-source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: Run gift browser regressions including immediate and automatic continuation
        working-directory: private-source
        run: npm run test:gifts
      - name: Validate and package the exact tested TapTap build
        working-directory: private-source
        env:
          PYTHON: python3
        run: node scripts/package-taptap.mjs
      - name: Upload built H5 package and mock-test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-gift-sync-v0.3.21
          path: |
            private-source/releases/forge-taptap-h5-v0.3.21.zip
            private-source/qa-evidence/gifts/
          if-no-files-found: warn
          retention-days: 14
