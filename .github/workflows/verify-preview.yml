name: Verify built preview
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published assets
        run: |
          python3 - <<'PY'
          import re,pathlib
          html=pathlib.Path('index.html').read_text()
          refs=re.findall(r'(?:src|href)="([^"]+)"',html)
          assets=[p for p in refs if p.endswith(('.js','.css'))]
          assert len(assets)>=2, 'Missing script or stylesheet'
          assert any(p.endswith('.js') for p in assets)
          assert any(p.endswith('.css') for p in assets)
          for path in assets:
              assert path.startswith('./'), 'Pages assets must be relative: '+path
              assert pathlib.Path(path).is_file(), path
          assert not any(p.startswith('/') for p in refs), 'Absolute asset path breaks project Pages'
          assert '/src/' not in html
          javascript='\n'.join(pathlib.Path(p).read_text() for p in assets if p.endswith('.js'))
          assert 'giant-panda' in javascript and 'reference-calibrated-sculpture-v12' in javascript, 'Missing sculpture panda model'
          assert 'polygon-sculpture' in javascript, 'Missing sculpture style'
          assert 'continuous-limbs-curled-fingers' in javascript, 'Missing revised panda limbs'
          assert 'cat-turnaround-v2.webp' not in javascript, 'Build still references removed cat atlas'
          # Prevent shipping an obsolete choice panel while core source has removed it.
          assert '<summary>锻造信息与道具</summary>' in html, 'Current forging panel title is missing'
          assert '锻法与铭文' not in html, 'Obsolete forging styles panel is still rendered'
          for old_id in ['safe','precise','bold','mark','mark-row']:
              assert f'id="{old_id}"' not in html, 'Obsolete forging control: '+old_id
          for obsolete in ['function Yc(', 'function lr()', 'z("mark")', 'cashout(e="none")', 'style:e,timing:t']:
              assert obsolete not in javascript, 'Obsolete forging/rune logic in preview bundle: '+obsolete
          assert '食铁兽' in html, 'Panda station label is missing'
          assert re.search(r'name="source-commit" content="[a-f0-9]{40}"',html), 'Missing source version'
          PY
      - name: Parse-check deployed JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          html=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*src="([^"]+\\.js)"',html)
          assert scripts, 'No JavaScript entry point in preview'
          for script in scripts:
              subprocess.run(['node','--check',script.removeprefix('./')],check=True)
          PY
